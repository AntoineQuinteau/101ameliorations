<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:24px;background-color:#f5f5f4;font-family:Arial,Helvetica,sans-serif;color:#1c1917;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background-color:#ffffff;border-radius:12px;padding:32px;">
      <tr>
        <td>
          <p style="margin:0 0 8px;font-size:14px;color:#57534e;">101améliorations</p>
          <h1 style="margin:0 0 16px;font-size:20px;color:#1c1917;">Votre code de connexion</h1>
          <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#44403c;">
            Utilisez ce code à 6 chiffres pour vous connecter. Il est valable 1 heure.
          </p>
          <p style="margin:0 0 24px;font-size:32px;font-weight:bold;letter-spacing:6px;color:#0f766e;text-align:center;">
            {{ .Token }}
          </p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#78716c;">
            Si vous n'êtes pas à l'origine de cette demande, vous pouvez ignorer cet email
            sans risque.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
