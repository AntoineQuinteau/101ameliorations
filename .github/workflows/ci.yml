name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Only PR runs are cancellable: a push to `main` now runs `db push` against
  # STAGING and production, and a newer merge must queue behind it rather than
  # kill it halfway through a migration.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Smoke build
        run: npm run build
        env:
          # VITE_* are inlined at build time; placeholders are enough to prove the
          # bundle builds. The real values are used by the preview/production jobs.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          VITE_MAPTILER_KEY: placeholder
          # Required by vite-plugins/buildEnvGuard.ts for any production build.
          VITE_TURNSTILE_SITE_KEY: placeholder

  database:
    name: Migrations and RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Start local Supabase
        run: supabase start
      - name: Replay every migration from scratch
        run: supabase db reset --no-seed
      - name: RLS tests (pgTAP)
        run: supabase test db
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated types are up to date
        run: |
          # Written inside the repo (not /tmp) so prettier finds
          # .prettierrc.json and formats it the same way `npm run
          # gen:types` does locally — otherwise this diffs formatted
          # output against prettier's unconfigured defaults and always
          # "fails" on style alone. --ignore-path /dev/null is needed
          # too: this exact path is in .gitignore (as a safety net in
          # case this script is interrupted before the final rm), and
          # prettier silently no-ops on a path its ignore file covers.
          supabase gen types typescript --local > src/types/database.generated.ts
          npx prettier --write --ignore-path /dev/null src/types/database.generated.ts
          diff -u src/types/database.ts src/types/database.generated.ts
          rm src/types/database.generated.ts

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Start local Supabase
        # Self-contained, like the `database` job: this runner's Supabase
        # instance is independent of (and outlives) `database`'s, which is
        # already stopped by the time this job would otherwise see it — jobs
        # don't share runners. Seeded this time (no --no-seed): the specs
        # need the three staff accounts (seed-moderator@/seed-authority@/
        # seed-admin@101ameliorations.test) and the ~630 seeded klashs that
        # `supabase/seed.sql` provides, not just the schema.
        run: supabase start
      - run: supabase db reset
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install managed Chromium
        # Real network access here, unlike the local sandbox this suite was
        # developed in — see playwright.config.ts's comment on
        # `systemChromiumPath`. That local-only override is gated on
        # `!process.env.CI` specifically so this job (CI sets `CI=true` by
        # default on GitHub Actions runners) always uses Playwright's own
        # managed browser, installed fresh here, and never looks for
        # /usr/bin/chromium-browser (which doesn't exist on this runner).
        run: npx playwright install --with-deps chromium
      - name: Run Playwright specs
        run: npm run e2e
        env:
          # Same reasoning as the `preview`/`deploy-production` jobs below:
          # not secrets, VITE_* are meant to be public. Points at this job's
          # own local Supabase (127.0.0.1:54321, `supabase start`'s fixed
          # local port) — not the STAGING project the `preview` job below
          # uses, and not the production project `deploy-production` uses.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
          # Routes the map at vite-plugins/tileProxy.ts (mounted by `npm run dev`,
          # which `npm run e2e`'s webServer runs — see playwright.config.ts) instead of
          # MapTiler directly. No MAPTILER_KEY is set here, so every spec that loads
          # the map (most of them, via loginAs()'s default redirect) gets placeholder
          # tiles and never touches MapTiler's real quota — see that plugin's docblock.
          VITE_TILE_BASE_URL: /__tiles
          # Cloudflare's dummy always-passing Turnstile sitekey (see
          # supabase/config.toml's [auth.captcha] and .env.example) — captcha
          # is genuinely enabled locally and in CI (this file is reused by
          # `supabase start`), not bypassed, so login must supply a token
          # that the dummy secret accepts.
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000BB
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  migrate-staging:
    name: Push migrations to STAGING
    # Same fork guard as `preview`: the `staging` environment's secret is not
    # exposed to forks. Also runs on push to `main`, so a merge can only reach
    # production after its migrations have applied cleanly on STAGING — and
    # STAGING never lags behind production.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Only after every migration has replayed from scratch and the RLS tests
    # pass on a throwaway local database.
    needs: database
    runs-on: ubuntu-latest
    # Holds the STAGING-only SUPABASE_DB_URL secret. See README, "Promotion
    # STAGING → production".
    environment: staging
    concurrency:
      # One STAGING database shared by every open PR: serialize the pushes.
      group: supabase-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: supabase db push (STAGING)
        env:
          # Session pooler connection string (IPv4), not the direct
          # db.<ref>.supabase.co host: GitHub-hosted runners have no IPv6.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # Fails — on purpose — if STAGING holds a migration this branch doesn't
        # have (another PR's, not yet merged here): rebase on main, or clean
        # STAGING up (README, "Promotion STAGING → production").
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

  preview:
    name: Preview deployment + QR
    # Secrets are not exposed to pull requests coming from forks.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # The preview runs against STAGING's schema: never deploy a bundle that
    # expects migrations STAGING doesn't have yet.
    needs: [quality, migrate-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # These are not secrets: VITE_* are inlined into the client bundle
          # by design (Supabase's "publishable" key and URL are meant to be
          # public, RLS is the real access control; the MapTiler key is
          # restricted by domain). Repo variables, not secrets.
          VITE_SUPABASE_URL: ${{ vars.VITE_STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          VITE_MAPTILER_KEY: ${{ vars.VITE_MAPTILER_KEY }}
          # Required: vite-plugins/buildEnvGuard.ts fails the build without
          # it, since Supabase's captcha is on and a bundle without a site
          # key sends no token — every login would be rejected.
          # STAGING's own Turnstile widget (its secret goes in STAGING's
          # Supabase captcha settings), falling back to production's while
          # that widget doesn't exist yet — harmless as long as STAGING's
          # captcha is off, since Supabase then ignores the token.
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_STAGING_TURNSTILE_SITE_KEY || vars.VITE_TURNSTILE_SITE_KEY }}
          # Optional — see src/lib/sentry.ts. Empty is fine: the build
          # behaves identically either way, which is exactly what the
          # `quality` job's smoke build (no Sentry var at all) already covers.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          # Tells preview errors apart from production ones in Sentry.
          VITE_SENTRY_ENVIRONMENT: staging

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.number }}
          # Runtime vars for workers/app/src/index.ts (the per-klash Open
          # Graph rewrite) — distinct from the VITE_* build-time vars above,
          # which get inlined into the client bundle and are invisible to
          # the Worker. Not secrets, same reasoning as the VITE_* ones.
          SUPABASE_URL: ${{ vars.VITE_STAGING_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          npx wrangler versions upload \
            --preview-alias "pr-${PR}" \
            --var "SUPABASE_URL:${SUPABASE_URL}" \
            --var "SUPABASE_PUBLISHABLE_KEY:${SUPABASE_PUBLISHABLE_KEY}" \
            --message "PR #${PR} — ${GITHUB_SHA::7}" | tee upload.log

          # The alias URL shape (https://<alias>-<worker>.<subdomain>.workers.dev)
          # is stable and confirmed against this account, so build it rather than
          # depend on wrangler's stdout format for something CI must parse.
          # Still cross-check against the log and fail loudly on a mismatch,
          # since a change here would otherwise go unnoticed.
          url="https://pr-${PR}-101ameliorations.antoine-quinteau.workers.dev"
          logged_url=$(grep -oE "https://pr-${PR}-[A-Za-z0-9.-]+\.workers\.dev" upload.log | head -1 || true)
          if [ -n "$logged_url" ] && [ "$logged_url" != "$url" ]; then
            echo "::error::preview alias URL mismatch: expected ${url}, wrangler logged ${logged_url}"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Sticky comment with preview URL and QR code
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          QR_WORKER_URL: ${{ vars.QR_WORKER_URL }}
        run: |
          set -euo pipefail
          encoded=$(jq -rn --arg u "$PREVIEW_URL" '$u|@uri')
          qr="${QR_WORKER_URL}/?u=${encoded}"
          {
            echo "<!-- preview-qr -->"
            echo "### 📱 Preview de la PR #${PR}"
            echo
            echo "**${PREVIEW_URL}**"
            echo
            echo "<img src=\"${qr}\" width=\"200\" alt=\"QR code de la preview\">"
            echo
            echo "_Commit \`${GITHUB_SHA::7}\` — l'URL reste la même pour toute la PR :"
            echo "scanner une fois, puis recharger la page après chaque push._"
          } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, database, migrate-staging]
    runs-on: ubuntu-latest
    # Holds production's SUPABASE_DB_URL. Restricted to the `main` branch in
    # the environment's settings, so no PR workflow can ever read it.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: supabase db push (production)
        env:
          # Session pooler connection string — see migrate-staging.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # Schema first, then the bundle that relies on it. If this step fails,
        # nothing below runs and the previous version keeps serving — which
        # is why migrations must stay backward compatible with the currently
        # deployed bundle (add first, drop in a later release).
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Not secrets — see the preview job above for why.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_MAPTILER_KEY: ${{ vars.VITE_MAPTILER_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Runtime vars for the Worker — see the preview job above.
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npx wrangler deploy \
            --var "SUPABASE_URL:${SUPABASE_URL}" \
            --var "SUPABASE_PUBLISHABLE_KEY:${SUPABASE_PUBLISHABLE_KEY}"
